<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Torwart Quote</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--orange:#ea580c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;border-radius:14px;padding:13px 15px;font-weight:750}input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
.app{max-width:760px;margin:auto;padding:16px 14px 86px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:25px;font-weight:900}.sub,.small{color:var(--muted);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000008}.title{font-size:18px;font-weight:850;margin-bottom:11px}.label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.primary{background:var(--blue);color:#fff}.secondary{background:#e5e7eb;color:#111827}.success{background:#dcfce7;color:#166534}.danger{background:#fee2e2;color:#991b1b}.dark{background:#111827;color:#fff}.orange{background:#ffedd5;color:#9a3412}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f9fafb;border-radius:13px;padding:10px;text-align:center}.num{font-size:19px;font-weight:900}
.keeperBtns{display:flex;gap:8px;overflow:auto}.keeperBtns button{white-space:nowrap;background:#e5e7eb}.keeperBtns button.active{background:var(--blue);color:#fff}
.shotType button,.result button{min-height:50px}.selected{outline:3px solid #93c5fd;background:#dbeafe!important}
.listitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:20}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px max(10px,calc((100% - 760px)/2 + 10px));display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;z-index:15}.nav button{padding:10px 6px;background:#f3f4f6;font-size:12px}.nav button.active{background:#dbeafe;color:#1d4ed8}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice button{background:#f3f4f6}.choice button.active{background:#dbeafe;color:#1d4ed8;outline:2px solid #93c5fd}
.keeper-row{display:flex;gap:8px;align-items:center;margin-top:8px}.keeper-row input{flex:1}.minus{width:46px;flex:0 0 46px;padding:12px;background:#fee2e2;color:#991b1b}
.timebox{background:#111827;color:#fff;border-radius:20px;padding:16px;text-align:center}.time-label{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:1px}.bigtime{font-size:42px;font-weight:950;letter-spacing:2px;margin:3px 0 10px}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wheel{height:142px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:14px;background:#1f2937}.wheel div{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:19px;color:#9ca3af}.wheel div.sel{font-size:25px;font-weight:900;color:#fff;background:#374151}
.quicktimes{display:flex;gap:6px;overflow:auto;margin-top:10px}.quicktimes button{white-space:nowrap;padding:9px 12px;background:#374151;color:#fff;font-size:12px}
.filtergrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filterbox{background:#f9fafb;border-radius:13px;padding:10px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY="torwartQuoteV21";let db=JSON.parse(localStorage.getItem(KEY)||'{"seasons":{},"activeGame":null}');
let state={screen:"home",selectedSeason:"2026/27",game:null,shotType:null,filters:{venue:"all",opponent:"all",keeper:"all"}};
if(!db.seasons[state.selectedSeason]){db.seasons[state.selectedSeason]={games:[]};save()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",1600)}
function sec(s){let[a,b]=String(s).split(":").map(Number);return a*60+b}function fmt(n){n=Math.max(0,Math.round(n||0));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function pct(h,g){let d=h+g;return d?((h/d)*100).toFixed(1)+" %":"–"}function season(){return db.seasons[state.selectedSeason]||={games:[]}}
function nav(){return `<div class="nav"><button class="${state.screen==='home'?'active':''}" onclick="goHome()">🏠 Saison</button><button class="${state.screen==='past'?'active':''}" onclick="goPast()">📋 Spiele</button><button class="${state.screen==='new'?'active':''}" onclick="goNew()">＋ Neues Spiel</button></div>`}
function goHome(){state.screen="home";state.game=null;render()}function goPast(){state.screen="past";state.game=null;render()}function goNew(){state.screen="new";state.game=null;render()}
function aggregate(games,kf="all"){let a={shots:0,held:0,goals:0,missed:0,sevenHeld:0,sevenGoals:0};games.forEach(g=>Object.values(g.keepers).forEach(k=>{if(kf!=="all"&&k.id!==kf)return;k.normal.forEach(x=>{a.shots++;if(x==="held")a.held++;if(x==="goal")a.goals++;if(x==="missed")a.missed++});k.seven.forEach(x=>{if(x==="held")a.sevenHeld++;if(x==="goal")a.sevenGoals++})}));return a}
function filteredGames(){return season().games.filter(g=>(state.filters.venue==="all"||g.venue===state.filters.venue)&&(state.filters.opponent==="all"||g.opponent===state.filters.opponent)&&(state.filters.keeper==="all"||Object.values(g.keepers).some(k=>k.id===state.filters.keeper)))}
function home(){let games=filteredGames(),a=aggregate(games,state.filters.keeper),opps=[...new Set(season().games.map(g=>g.opponent))],ks=[...new Map(season().games.flatMap(g=>Object.values(g.keepers)).map(k=>[k.id,k.name])).entries()];return `<div class="app"><div class="top"><div><div class="brand">🥅 Torwart Quote</div><div class="sub">Handball-Torwartstatistik</div></div></div>${db.activeGame?`<div class="card" style="border-color:#93c5fd"><div class="title">⏯ Unfertiges Spiel</div><div><b>${esc(db.activeGame.opponent)}</b> · ${fmt(db.activeGame.currentTimeSec)} · ${db.activeGame.venue==="home"?"Heim":"Auswärts"}</div><div class="small">Aktiv: ${esc(db.activeGame.keepers[db.activeGame.activeKeeperId]?.name||"–")}</div><button class="primary" style="width:100%;margin-top:10px" onclick="resume()">Spiel fortsetzen</button></div>`:""}<div class="card"><div class="title">Saison</div><div class="row"><select onchange="state.selectedSeason=this.value;state.filters={venue:'all',opponent:'all',keeper:'all'};render()">${Object.keys(db.seasons).map(s=>`<option ${s===state.selectedSeason?"selected":""}>${esc(s)}</option>`).join("")}</select><button class="secondary" onclick="newSeason()">Neue Saison</button></div></div><div class="card"><div class="title">Saisonübersicht</div><div class="filtergrid"><div class="filterbox"><label class="label">Heim / Auswärts</label><select onchange="state.filters.venue=this.value;render()"><option value="all">Alle</option><option value="home" ${state.filters.venue==="home"?"selected":""}>🏠 Heim</option><option value="away" ${state.filters.venue==="away"?"selected":""}>✈️ Auswärts</option></select></div><div class="filterbox"><label class="label">Gegner</label><select onchange="state.filters.opponent=this.value;render()"><option value="all">Alle Gegner</option>${opps.map(o=>`<option value="${esc(o)}" ${state.filters.opponent===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div><div class="filterbox"><label class="label">Torhüter</label><select onchange="state.filters.keeper=this.value;render()"><option value="all">Alle Torhüter</option>${ks.map(([id,n])=>`<option value="${esc(id)}" ${state.filters.keeper===id?"selected":""}>${esc(n)}</option>`).join("")}</select></div></div><div class="small" style="margin:10px 0">Auswertung: ${games.length} Spiel${games.length===1?"":"e"}</div><div class="statgrid"><div class="stat"><div class="num">${games.length}</div><div class="small">Spiele</div></div><div class="stat"><div class="num">${a.shots}</div><div class="small">Würfe</div></div><div class="stat"><div class="num">${pct(a.held,a.goals)}</div><div class="small">Quote</div></div><div class="stat"><div class="num">${a.held}</div><div class="small">Paraden</div></div><div class="stat"><div class="num">${a.goals}</div><div class="small">Gegentore</div></div><div class="stat"><div class="num">${pct(a.sevenHeld,a.sevenGoals)}</div><div class="small">7-m-Quote</div></div></div></div><button class="primary" style="width:100%" onclick="goNew()">＋ Neues Spiel</button></div>${nav()}`}
function newSeason(){let n=prompt("Name der Saison, z. B. 2026/27");if(!n)return;db.seasons[n]||={games:[]};state.selectedSeason=n;state.filters={venue:"all",opponent:"all",keeper:"all"};save();render()}
function newGame(){return `<div class="app"><div class="top"><div><div class="brand">Neues Spiel</div><div class="sub">${esc(state.selectedSeason)}</div></div><button class="secondary" onclick="goHome()">Zurück</button></div><div class="card"><label class="label">Gegner</label><input id="opponent" placeholder="z. B. TV Beispiel"><div class="label">Spielort</div><div class="choice"><button id="homeBtn" class="active" onclick="setVenue('home')">🏠 Heim</button><button id="awayBtn" onclick="setVenue('away')">✈️ Auswärts</button></div><input type="hidden" id="venue" value="home"><label class="label">Spieltag</label><input id="matchday" placeholder="z. B. 3. Spieltag"><label class="label">Datum</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><label class="label">Torhüter</label><div id="keeperInputs"><div class="keeper-row"><input class="keeperInput" placeholder="Torhüter 1"><button class="minus" onclick="removeKeeper(this)">−</button></div></div><button class="secondary" style="margin-top:9px" onclick="addKeeperInput()">＋ Torhüter hinzufügen</button></div><button class="primary" style="width:100%" onclick="startGame()">Spiel starten</button></div>${nav()}`}
function setVenue(v){document.getElementById("venue").value=v;homeBtn.classList.toggle("active",v==="home");awayBtn.classList.toggle("active",v==="away")}
function addKeeperInput(){let d=document.getElementById("keeperInputs"),n=d.querySelectorAll(".keeper-row").length+1,r=document.createElement("div");r.className="keeper-row";r.innerHTML=`<input class="keeperInput" placeholder="Torhüter ${n}"><button class="minus" onclick="removeKeeper(this)">−</button>`;d.appendChild(r)}
function removeKeeper(b){let rows=document.querySelectorAll(".keeper-row");if(rows.length<=1){toast("Mindestens ein Torhüter ist erforderlich");return}b.parentElement.remove();[...document.querySelectorAll(".keeperInput")].forEach((x,i)=>x.placeholder="Torhüter "+(i+1))}
function startGame(){let names=[...document.querySelectorAll(".keeperInput")].map(x=>x.value.trim()).filter(Boolean);if(!names.length){toast("Bitte mindestens einen Torhüter eingeben");return}let keepers={};names.forEach((n,i)=>keepers["k"+i]={id:"k"+i,name:n,normal:[],seven:[],own:[],segments:[{start:0,end:null}]});state.game={id:Date.now(),season:state.selectedSeason,opponent:document.getElementById("opponent").value.trim()||"Unbekannt",venue:document.getElementById("venue").value,matchday:document.getElementById("matchday").value.trim(),date:document.getElementById("date").value,currentTimeSec:0,activeKeeperId:"k0",keepers,paused:false,events:[]};db.activeGame=state.game;save();state.screen="game";render()}
function resume(){state.game=db.activeGame;state.screen="game";render()}function persist(){db.activeGame=state.game;save()}
function game(){let g=state.game,k=g.keepers[g.activeKeeperId];return `<div class="app"><div class="top"><div><div class="brand">Laufendes Spiel</div><div class="sub">${g.venue==="home"?"🏠 Heim":"✈️ Auswärts"} · ${esc(g.opponent)}</div></div></div><div class="card"><div class="timebox"><div class="time-label">Offizielle Spielzeit</div><div class="bigtime" id="bigtime">${fmt(g.currentTimeSec)}</div><div class="wheels"><div class="wheel" id="minWheel"></div><div class="wheel" id="secWheel"></div></div><div class="quicktimes">${[0,10,20,30,40,50,60].map(m=>`<button onclick="setWheelTime(${m*60})">${m}:00</button>`).join("")}</div><button class="primary" style="width:100%;margin-top:10px" onclick="applyWheelTime()">✓ Spielzeit übernehmen</button></div><div class="small" style="margin-top:9px">Die Spielzeit läuft nicht automatisch.</div></div><div class="card"><div class="title">Aktiver Torhüter</div><div class="keeperBtns">${Object.values(g.keepers).map(x=>`<button class="${x.id===g.activeKeeperId?"active":""}" onclick="selectKeeper('${x.id}')">${esc(x.name)}</button>`).join("")}</div><button class="orange" style="width:100%;margin-top:10px" onclick="substitution()">🔄 Torhüterwechsel</button></div><div class="card"><div class="title">Wurf erfassen</div><div class="small">1. Wurfart</div><div class="grid shotType" style="margin-top:7px">${[["6m","6 m"],["9m","9 m"],["circle","Kreis"],["counter","Gegenstoß"],["other","Sonstiger"]].map(x=>`<button class="${state.shotType===x[0]?"selected":""}" onclick="state.shotType='${x[0]}';render()">${x[1]}</button>`).join("")}</div><div class="small" style="margin-top:12px">2. Ergebnis</div><div class="grid3 result" style="margin-top:7px"><button class="success" onclick="shot('held')">🧤 Parade</button><button class="danger" onclick="shot('goal')">❌ Tor</button><button class="secondary" onclick="shot('missed')">➖ Vorbei</button></div></div><div class="card"><div class="title">7-Meter</div><div class="grid3"><button class="success" onclick="seven('held')">🧤 Parade</button><button class="danger" onclick="seven('goal')">❌ Tor</button><button class="secondary" onclick="seven('missed')">➖ Vorbei</button></div></div><div class="card"><div class="title">Eigene Torwartaktionen</div><div class="grid"><button class="success" onclick="own('goal')">⚽ Torwarttor</button><button class="danger" onclick="own('error')">⚠️ Technischer Fehler</button></div></div><div class="card"><div class="title">${esc(k.name)}</div><div class="statgrid"><div class="stat"><div class="num">${k.normal.filter(x=>x==="held").length}</div><div class="small">Paraden</div></div><div class="stat"><div class="num">${k.normal.filter(x=>x==="goal").length}</div><div class="small">Gegentore</div></div><div class="stat"><div class="num">${pct(k.normal.filter(x=>x==="held").length,k.normal.filter(x=>x==="goal").length)}</div><div class="small">Quote</div></div></div></div><div class="row"><button class="secondary" onclick="pauseGame()">⏸ Pause</button><button class="dark" onclick="finishGame()">✓ Spiel beenden</button></div></div><div class="nav"><button onclick="pauseGame()">⏸ Pause</button><button class="active">🥅 Spiel</button><button onclick="finishGame()">✓ Beenden</button></div>`}
function initWheels(){let g=state.game,m=Math.floor(g.currentTimeSec/60),s=g.currentTimeSec%60,mw=document.getElementById("minWheel"),sw=document.getElementById("secWheel");if(!mw||!sw)return;mw.innerHTML=[...Array(61)].map((_,i)=>`<div class="${i===m?"sel":""}">${String(i).padStart(2,"0")}</div>`).join("");sw.innerHTML=[...Array(60)].map((_,i)=>`<div class="${i===s?"sel":""}">${String(i).padStart(2,"0")}</div>`).join("");mw.scrollTop=Math.max(0,m*44-49);sw.scrollTop=Math.max(0,s*44-49);[mw,sw].forEach(w=>w.addEventListener("scroll",()=>{clearTimeout(w._t);w._t=setTimeout(()=>{let v=Math.round((w.scrollTop+49)/44),max=w===mw?60:59;v=Math.max(0,Math.min(max,v));[...w.children].forEach((x,i)=>x.classList.toggle("sel",i===v));let mm=w===mw?v:Math.floor(state.game.currentTimeSec/60),ss=w===sw?v:state.game.currentTimeSec%60;document.getElementById("bigtime").textContent=fmt(mm*60+ss)},70)}))}
function setWheelTime(n){let mw=document.getElementById("minWheel"),sw=document.getElementById("secWheel");if(!mw||!sw)return;let m=Math.floor(n/60),s=n%60;mw.scrollTop=Math.max(0,m*44-49);sw.scrollTop=Math.max(0,s*44-49);[...mw.children].forEach((x,i)=>x.classList.toggle("sel",i===m));[...sw.children].forEach((x,i)=>x.classList.toggle("sel",i===s));document.getElementById("bigtime").textContent=fmt(n)}
function wheelValue(id){let w=document.getElementById(id);return Math.max(0,Math.min(id==="minWheel"?60:59,Math.round((w.scrollTop+49)/44)))}
function applyWheelTime(){let n=wheelValue("minWheel")*60+wheelValue("secWheel");if(n<state.game.currentTimeSec){toast("Zeit darf nicht rückwärts gehen");setWheelTime(state.game.currentTimeSec);return}state.game.currentTimeSec=n;persist();render();toast("Spielzeit gespeichert")}
function selectKeeper(id){state.game.activeKeeperId=id;persist();render()}
function substitution(){let g=state.game,v=prompt("Wechselzeit (MM:SS)",fmt(g.currentTimeSec));if(v===null)return;if(!/^\d{1,2}:[0-5]\d$/.test(v)){toast("Ungültige Zeit");return}let t=sec(v);if(t<g.currentTimeSec||t>3600){toast("Zeit muss nach der aktuellen Zeit liegen");return}let ids=Object.keys(g.keepers),c=prompt("Neuer Torhüter:\n"+ids.map((id,i)=>(i+1)+": "+g.keepers[id].name).join("\n"));if(c===null)return;let idx=Number(c)-1;if(!ids[idx]){toast("Ungültige Auswahl");return}g.keepers[g.activeKeeperId].segments.at(-1).end=t;g.keepers[ids[idx]].segments.push({start:t,end:null});g.activeKeeperId=ids[idx];g.currentTimeSec=t;persist();render();toast("Torhüterwechsel gespeichert")}
function shot(r){if(!state.shotType){toast("Bitte Wurfart wählen");return}let k=state.game.keepers[state.game.activeKeeperId];k.normal.push(r);state.game.events.push({time:state.game.currentTimeSec,type:"shot",shotType:state.shotType,result:r,keeper:k.id});persist();state.shotType=null;render()}
function seven(r){let k=state.game.keepers[state.game.activeKeeperId];k.seven.push(r);state.game.events.push({time:state.game.currentTimeSec,type:"seven",result:r,keeper:k.id});persist();render()}
function own(r){let k=state.game.keepers[state.game.activeKeeperId];k.own.push(r);state.game.events.push({time:state.game.currentTimeSec,type:"own",result:r,keeper:k.id});persist();render()}
function pauseGame(){state.game.paused=true;persist();state.game=null;state.screen="home";render();toast("Spiel gespeichert")}
function finishGame(){let g=state.game,v=prompt("Endgültige Spielzeit (MM:SS)",fmt(g.currentTimeSec));if(v===null)return;if(!/^\d{1,2}:[0-5]\d$/.test(v)){toast("Ungültige Zeit");return}let t=sec(v);if(t<g.currentTimeSec||t>3600){toast("Endzeit ungültig");return}g.currentTimeSec=t;g.keepers[g.activeKeeperId].segments.at(-1).end=t;g.paused=false;db.seasons[g.season].games.unshift(g);db.activeGame=null;save();state.game=g;state.screen="summary";render()}
function playtime(k){return k.segments.reduce((a,s)=>a+(s.end==null?0:s.end-s.start),0)}
function keeperSummary(k,g){let h=k.normal.filter(x=>x==="held").length,go=k.normal.filter(x=>x==="goal").length,sv=k.seven.filter(x=>x==="held").length,sg=k.seven.filter(x=>x==="goal").length,og=k.own.filter(x=>x==="goal").length,er=k.own.filter(x=>x==="error").length,by={};["6m","9m","circle","counter","other"].forEach(t=>{let a=g.events.filter(e=>e.keeper===k.id&&e.type==="shot"&&e.shotType===t),ph=a.filter(x=>x.result==="held").length,pg=a.filter(x=>x.result==="goal").length;by[t]=[ph,pg]});return `<div class="card"><div class="title">${esc(k.name)}</div><div class="small">Spielzeit: <b>${fmt(playtime(k))}</b></div><div class="statgrid" style="margin-top:10px"><div class="stat"><div class="num">${h}</div><div class="small">Paraden</div></div><div class="stat"><div class="num">${go}</div><div class="small">Gegentore</div></div><div class="stat"><div class="num">${pct(h,go)}</div><div class="small">Quote</div></div><div class="stat"><div class="num">${sv}/${sg}</div><div class="small">7 m</div></div><div class="stat"><div class="num">${og}</div><div class="small">Torwarttore</div></div><div class="stat"><div class="num">${er}</div><div class="small">Fehler</div></div></div><table style="margin-top:12px"><tr><th>Wurfart</th><th>Paraden</th><th>Tore</th><th>Quote</th></tr>${[["6m","6 m"],["9m","9 m"],["circle","Kreis"],["counter","Gegenstoß"],["other","Sonstiger"]].map(x=>`<tr><td>${x[1]}</td><td>${by[x[0]][0]}</td><td>${by[x[0]][1]}</td><td>${pct(by[x[0]][0],by[x[0]][1])}</td></tr>`).join("")}</table></div>`}
function summary(g){return `<div class="app"><div class="top"><div><div class="brand">Spiel beendet</div><div class="sub">${g.venue==="home"?"🏠 Heim":"✈️ Auswärts"} · ${esc(g.opponent)} · ${esc(g.date)}</div></div><button class="secondary" onclick="goPast()">Zurück</button></div><div class="card"><div class="title">Spielübersicht</div><div class="statgrid"><div class="stat"><div class="num">${fmt(g.currentTimeSec)}</div><div class="small">Spielzeit</div></div><div class="stat"><div class="num">${Object.keys(g.keepers).length}</div><div class="small">Torhüter</div></div><div class="stat"><div class="num">${g.events.length}</div><div class="small">Aktionen</div></div></div></div>${Object.values(g.keepers).map(k=>keeperSummary(k,g)).join("")}<div class="grid"><button class="secondary" onclick="goPast()">Vergangene Spiele</button><button class="primary" onclick="goNew()">Neues Spiel</button></div><button class="dark" style="width:100%;margin-top:8px" onclick="goHome()">Saisonübersicht</button></div>${nav()}`}
function past(){return `<div class="app"><div class="top"><div><div class="brand">Vergangene Spiele</div><div class="sub">${esc(state.selectedSeason)}</div></div><button class="secondary" onclick="goHome()">Zurück</button></div><div class="card">${season().games.length?season().games.map((g,i)=>{let a=aggregate([g]);return `<div class="listitem"><div><b>${esc(g.opponent)}</b><div class="small">${g.venue==="home"?"🏠 Heim":"✈️ Auswärts"} · ${esc(g.date)} · ${esc(g.matchday)}</div><span class="badge">${pct(a.held,a.goals)}</span></div><button class="secondary" onclick="state.game=season().games[${i}];state.screen='summary';render()">Öffnen</button></div>`}).join(""):`<div class="small">Noch keine Spiele gespeichert.</div>`}</div></div>${nav()}`}
function render(){document.getElementById("app").innerHTML=state.screen==="home"?home():state.screen==="new"?newGame():state.screen==="game"?game():state.screen==="past"?past():summary(state.game);if(state.screen==="game")setTimeout(initWheels,0)}
render();
</script></body></html>
